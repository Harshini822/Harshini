
//16. DOM Manipulation

<!DOCTYPE html>
<html>
  <head>
    <title>Hello World!</title>

  </head>
  <body>
      <button id="btn">Click</button>
  
<script>
    document.getElementById("btn").addEventListener("click", function() {
        this.textContent = "Clicked";
    });
</script>

  </body>
</html>

//17. CSS Manipulation
<!DOCTYPE html>
<html>
  <head>
    <title>Hello World!</title>

  </head>
  <body>
      <h1>Heading Tag</h1>
      <div class = "a">
      <p>
        CSS Manipulaton
      </p>
      <button id="btn">Click</button>
      </div>
  
<script>
    document.getElementById("btn").addEventListener("click", function() {
        document.querySelector('.a').style.backgroundColor = 'red';
    });
</script>

  </body>
</html>
